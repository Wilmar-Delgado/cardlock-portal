{% extends "base.html" %}

{% block title %}
    Login | Card-Lock Portal
{% endblock %}

{% block content %}

<h2>Sign In</h2>

{% if form.errors %}
    <p>
        Invalid username or password.
    </p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label for="{{ form.username.id_for_label }}">
            Username
        </label>

        {{ form.username }}
    </div>

    <br>

    <div>
        <label for="{{ form.password.id_for_label }}">
            Password
        </label>

        {{ form.password }}
    </div>

    <br>

    <button type="submit">
        Sign In
    </button>
</form>

{% endblock %}
